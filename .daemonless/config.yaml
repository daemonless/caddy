# dbuild configuration file
# Full reference: https://github.com/daemonless/dbuild

build:
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
      tag_desc: "Official upstream Caddy FreeBSD binary (auto-tracks latest release)."
    - tag: pkg
      containerfile: Containerfile.pkg
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15.1-latest"

cit:
  mode: health
  port: 80
  health: /
  ready: "server running"
  # Caddy binds 80/443 and must run as root; the PUID/ownership check
  # does not apply (adguardhome pattern).
  puid: false
